name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Jobs only get the access they ask for.
permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Integration tests start real Kafka, Redis and MongoDB through Testcontainers.
      - name: Build and test
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify | tee build.log
      # Annotations show on the run's page without opening the full log.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          echo "::notice title=Environment::$(docker version --format 'Docker {{.Server.Version}} API {{.Server.APIVersion}}' 2>&1); $(. /etc/os-release && echo "$PRETTY_NAME")"
          { grep -hE 'tc\.mongo' build.log | grep -v 'Pulling\|Starting to pull' || true; } | cut -c1-240 | head -n 5 | while IFS= read -r line; do
            echo "::notice title=TC::${line}"
          done
          docker run -d --name diag mongo:8.0 --replSet docker-rs >/dev/null 2>&1 || true
          sleep 12
          echo "::notice title=State::$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} image={{.Image}}' diag 2>&1)"
          { docker logs diag 2>&1 | grep -iE '"s":"(E|F|W)"|error|fatal|illegal' || true; } | cut -c1-220 | head -n 4 | while IFS= read -r line; do
            echo "::notice title=MongoLog::${line}"
          done
          { grep -n -A2 -m1 'should be started first' build.log || true; } | cut -c1-220 | while IFS= read -r line; do
            echo "::warning title=FirstError::${line}"
          done
          { grep -hE 'Exception|ERROR.*testcontainers|Could not|Timed out' build.log | grep -v 'should be started first\|UnsatisfiedDependency\|BeanCreation\|BeanInstantiation\|^\[ERROR\]' || true; } | cut -c1-220 | sort -u | head -n 5 | while IFS= read -r line; do
            echo "::warning title=Other::${line}"
          done
          { grep -E '^\[(INFO|ERROR)\] +(Tests run:.* -- in|Tests run: [0-9]+, F)' build.log || true; } | sed 's/\[ERROR\]/[FAILED]/' | cut -c1-200 | tail -n 8 | while IFS= read -r line; do
            echo "::warning title=Summary::${line}"
          done
          # Root causes first: one startup failure can fail every test in a class.
          { grep -hE '^Caused by:' target/surefire-reports/*.txt || true; } | cut -c1-280 | sort -u | head -n 6 | while IFS= read -r line; do
            echo "::error title=Cause::${line}"
          done
          { grep -E '^\[ERROR\] (Tests run|.*FAILURE|.*Tests)' build.log || true; } | cut -c1-280 | head -n 3 | while IFS= read -r line; do
            echo "::error title=Build::${line}"
          done
      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  images:
    name: Docker image (${{ matrix.image.name }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            context: .
          - name: web
            context: frontend
    env:
      # Pull requests only prove the image builds. Publishing needs a merge to main.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out image names
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
